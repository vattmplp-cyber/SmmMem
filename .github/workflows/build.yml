name: Build SmmMem Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Activate x64 VS Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Patch Build Flags and Run
      shell: cmd
      run: |
        cd src
        :: Підміняємо налаштування компілятора в батнику автора, щоб вимкнути перевірку стеку
        powershell -Command "(Get-Content build.cmd) -replace '/O1 /Oi', '/O1 /Oi /Gs999999' | Set-Content build.cmd"
        
        :: Запускаємо збірку
        build.cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmmMem-Binaries
        path: src/Work/build_debug04/*
