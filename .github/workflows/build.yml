name: Build SmmMem Drivers

on:
  workflow_dispatch: # Кнопка ручного запуску

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Activate x64 VS Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Run Build Script From Its Folder
      shell: cmd
      run: |
        cd src
        build.cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmmMem-Binaries
        path: src/Work/build_debug04/*   # Збираємо точно звідти, куди вказав батник
