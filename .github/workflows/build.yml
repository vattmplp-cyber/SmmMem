name: Build SmmMem Drivers

on:
  workflow_dispatch: # Кнопка ручного запуску

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Activate x64 VS Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64 # Активує саме x64 оточення, яке просить скрипт

    - name: Run Release Build Script
      shell: cmd
      run: |
        call src\build.cmd

    - name: Run Debug Build Script
      shell: cmd
      run: |
        call src_dbg01\build.cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmmMem-Binaries
        path: Work/build/*
