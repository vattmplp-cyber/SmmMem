name: Build SmmMem Drivers

on:
  workflow_dispatch: # Кнопка ручного запуску

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run Author Build Script
      shell: cmd
      run: |
        python Work/build.py --src

    - name: Run Author Debug Build Script
      shell: cmd
      run: |
        python Work/build.py --debug

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmmMem-Binaries
        path: Work/build/*
